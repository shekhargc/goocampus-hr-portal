<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password &mdash; GooCampus CRM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --orange: #F58220; --orange-dark: #D96E0E;
            --navy: #1B2A4A; --navy-dark: #0F1B33;
            --white: #FFFFFF; --gray-50: #F8FAFC;
            --gray-200: #E2E8F0; --gray-400: #94A3B8; --gray-500: #64748B;
            --gray-700: #334155;
            --success: #10B981; --danger: #EF4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--navy) 0%, #2A3F66 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .card {
            background: var(--white); border-radius: 1rem; box-shadow: 0 25px 80px rgba(0,0,0,0.3);
            padding: 2.5rem; width: 100%; max-width: 420px; margin: 2rem;
        }
        .card-header { margin-bottom: 1.5rem; text-align: center; }
        .card-title { font-size: 1.4rem; font-weight: 700; color: var(--navy); margin-bottom: 0.35rem; }
        .card-subtitle { font-size: 0.9rem; color: var(--gray-500); }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label {
            display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.85rem;
            color: var(--gray-700); text-transform: uppercase; letter-spacing: 0.4px;
        }
        .form-input {
            width: 100%; padding: 0.85rem 1.1rem; border: 2px solid var(--gray-200);
            border-radius: 0.6rem; font-family: inherit; font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s; background: var(--gray-50);
        }
        .form-input:focus {
            outline: none; border-color: var(--orange);
            box-shadow: 0 0 0 3px rgba(245,130,32,0.15); background: var(--white);
        }
        .btn {
            width: 100%; padding: 0.9rem; background: linear-gradient(135deg, var(--orange), var(--orange-dark));
            color: var(--white); border: none; border-radius: 0.6rem; cursor: pointer;
            font-size: 0.95rem; font-weight: 600; font-family: inherit;
            transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 6px 20px rgba(245,130,32,0.3);
            text-transform: uppercase; letter-spacing: 0.3px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(245,130,32,0.4); }
        .alert { padding: 0.85rem 1.1rem; margin-bottom: 1.25rem; border-radius: 0.6rem; border-left: 4px solid; font-size: 0.9rem; }
        .alert-error { background: #FEF2F2; border-color: var(--danger); color: #991B1B; }
        .alert-success { background: #ECFDF5; border-color: var(--success); color: #065F46; }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">Set New Password</h2>
            <p class="card-subtitle">Enter and confirm your new password</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" class="form-input"
                       placeholder="Minimum 4 characters" required autofocus>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-input"
                       placeholder="Re-enter new password" required>
            </div>
            <button type="submit" class="btn">Reset Password</button>
        </form>
    </div>
</body>
</html>
