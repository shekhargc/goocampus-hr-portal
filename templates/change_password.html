{% extends "base.html" %}

{% block title %}Change Password - GooCampus HR Portal{% endblock %}

{% block extra_css %}
<style>
    .page-title { font-size: 2rem; font-weight: 700; color: var(--navy); margin-bottom: 2.5rem; }
</style>
{% endblock %}

{% block content %}
<h1 class="page-title">Change Password</h1>
<div class="card">
    <form method="POST" style="max-width: 600px;">
        <div class="form-group">
            <label for="old_password">Current Password</label>
            <input type="password" id="old_password" name="old_password" required>
        </div>

        <div class="form-group">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password" required>
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>

        <div style="display: flex; gap: 1.25rem; margin-top: 2.5rem;">
            <button type="submit" class="button">Change Password</button>
            <a href="/dashboard" class="button button-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
