{% extends "base.html" %}

{% block title %}Profile - GooCampus HR Portal{% endblock %}

{% block content %}
<div class="card">
    <h1 class="card-title">My Profile</h1>

    <form method="POST" style="max-width: 600px;">
        <div class="form-group">
            <label>Name</label>
            <input type="text" value="{{ user.name }}" disabled style="background: #f1f5f9; color: #64748b;">
        </div>

        <div class="form-group">
            <label>Employee Code</label>
            <input type="text" value="{{ user.emp_code }}" disabled style="background: #f1f5f9; color: #64748b;">
        </div>

        <div class="form-group">
            <label>Department</label>
            <input type="text" value="{{ user.department or '-' }}" disabled style="background: #f1f5f9; color: #64748b;">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" value="{{ user.email or '' }}">
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input type="tel" name="phone" value="{{ user.phone or '' }}">
        </div>

        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" name="dob" value="{{ user.dob or '' }}">
        </div>

        <div class="form-group">
            <label>Address</label>
            <textarea name="address">{{ user.address or '' }}</textarea>
        </div>

        <h2 style="margin-top: 2rem; margin-bottom: 1rem; font-size: 1.1rem;">Emergency Contact</h2>

        <div class="form-group">
            <label>Name</label>
            <input type="text" name="emergency_contact_name" value="{{ user.emergency_contact_name or '' }}">
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input type="tel" name="emergency_contact_phone" value="{{ user.emergency_contact_phone or '' }}">
        </div>

        <div class="form-group">
            <label>Relation</label>
            <input type="text" name="emergency_contact_relation" value="{{ user.emergency_contact_relation or '' }}">
        </div>

        <div style="display: flex; gap: 1rem;">
            <button type="submit" class="button">Save Changes</button>
            <a href="/dashboard" class="button button-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
