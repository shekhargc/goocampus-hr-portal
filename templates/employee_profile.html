{% extends "base.html" %}

{% block title %}Profile - GooCampus HR Portal{% endblock %}

{% block extra_css %}
<style>
    .page-title { font-size: 2rem; font-weight: 700; color: var(--navy); margin-bottom: 2.5rem; }
</style>
{% endblock %}

{% block content %}
<h1 class="page-title">My Profile</h1>
<div class="card">

    <form method="POST" style="max-width: 650px;">
        <div class="form-group">
            <label>Name</label>
            <input type="text" value="{{ user.name }}" disabled style="background: var(--gray-100); color: var(--gray-500);">
        </div>

        <div class="form-group">
            <label>Employee Code</label>
            <input type="text" value="{{ user.emp_code }}" disabled style="background: var(--gray-100); color: var(--gray-500);">
        </div>

        <div class="form-group">
            <label>Department</label>
            <input type="text" value="{{ user.department or '-' }}" disabled style="background: var(--gray-100); color: var(--gray-500);">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" value="{{ user.email or '' }}">
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input type="tel" name="phone" value="{{ user.phone or '' }}">
        </div>

        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" name="dob" value="{{ user.dob or '' }}">
        </div>

        <div class="form-group">
            <label>Address</label>
            <textarea name="address">{{ user.address or '' }}</textarea>
        </div>

        <h2 style="margin-top: 3rem; margin-bottom: 2rem; font-size: 1.3rem; font-weight: 600; color: var(--navy);">Emergency Contact</h2>

        <div class="form-group">
            <label>Name</label>
            <input type="text" name="emergency_contact_name" value="{{ user.emergency_contact_name or '' }}">
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input type="tel" name="emergency_contact_phone" value="{{ user.emergency_contact_phone or '' }}">
        </div>

        <div class="form-group">
            <label>Relation</label>
            <input type="text" name="emergency_contact_relation" value="{{ user.emergency_contact_relation or '' }}">
        </div>

        <div style="display: flex; gap: 1.25rem; margin-top: 2.5rem;">
            <button type="submit" class="button">Save Changes</button>
            <a href="/dashboard" class="button button-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
