services:
  - type: web
    name: goocampus-hr-portal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: goocampus-hr-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: goocampus-hr-db
    databaseName: goocampus_hr
