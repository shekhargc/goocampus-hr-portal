function computeQuickResults(answers) {
  const dims={};const effortScores={LowEffort:0,MedEffort:0,HighEffort:0,VeryHighEffort:0};const industries={};
  answers.forEach((optIdx,qIdx)=>{
    const opt=QUICK_QUESTIONS[qIdx].opts[optIdx];
    Object.entries(opt.s).forEach(([dim,val])=>{
      if(effortScores.hasOwnProperty(dim))effortScores[dim]+=val;
      else dims[dim]=(dims[dim]||0)+val;
    });
    if(opt.ef)industries[opt.ef]=(industries[opt.ef]||0)+1;
  });
  const typeScores={};Object.keys(QUICK_PERSONALITY_TYPES).forEach(t=>{typeScores[t]=0;});
  Object.entries(dims).forEach(([dim,val])=>{const t=QUICK_DIM_TO_TYPE[dim];if(t)typeScores[t]+=val;});
  const sortedTypes=Object.entries(typeScores).sort((a,b)=>b[1]-a[1]);
  const topType=sortedTypes[0][0];
  const totalScore=sortedTypes.reduce((s,t)=>s+t[1],0)||1;
  const typePercentages={};
  sortedTypes.forEach(([type,score])=>{typePercentages[type]=Math.round((score/totalScore)*100);});
  const pSum=Object.values(typePercentages).reduce((a,b)=>a+b,0);
  if(pSum!==100)typePercentages[sortedTypes[0][0]]+=(100-pSum);
  const effortEntries=Object.entries(effortScores).sort((a,b)=>b[1]-a[1]);
  let effortTier='Medium (4-5 years)';
  if(effortEntries[0][1]>0){const map={LowEffort:'Low (3 years)',MedEffort:'Medium (4-5 years)',HighEffort:'High (5-7 years)',VeryHighEffort:'Very High (7-10+ years)'};effortTier=map[effortEntries[0][0]];}
  const sortedIndustries=Object.entries(industries).sort((a,b)=>b[1]-a[1]).slice(0,3).map(i=>i[0]);
  const typeData=QUICK_PERSONALITY_TYPES[topType];
  const streamEntries=Object.entries(typeData.streams).sort((a,b)=>b[1]-a[1]);
  return {personality:topType,personalityData:typeData,typePercentages,topStream:streamEntries[0][0],streamScores:typeData.streams,effortTier,topIndustries:sortedIndustries.length?sortedIndustries:typeData.industries.slice(0,3),dims,dimToType:QUICK_DIM_TO_TYPE,testType:'quick'};
}

function computeStreamFinderResults(answers) {
  const dims={};const streamDirect={Science:0,Commerce:0,Arts:0,Vocational:0};
  answers.forEach((optIdx,qIdx)=>{
    const opt=SF_QUESTIONS[qIdx].opts[optIdx];
    Object.entries(opt.s).forEach(([dim,val])=>{dims[dim]=(dims[dim]||0)+val;});
    if(opt.sm)Object.entries(opt.sm).forEach(([stream,val])=>{streamDirect[stream]+=val;});
  });
  const streamFromDims={Science:0,Commerce:0,Arts:0,Vocational:0};
  Object.entries(dims).forEach(([dim,val])=>{const w=SF_STREAM_WEIGHTS[dim];if(w)Object.entries(w).forEach(([s,wt])=>{streamFromDims[s]+=val*wt;});});
  const streamRaw={};['Science','Commerce','Arts','Vocational'].forEach(s=>{streamRaw[s]=(streamDirect[s]*0.4)+(streamFromDims[s]*0.6);});
  const streamTotal=Object.values(streamRaw).reduce((a,b)=>a+b,0)||1;
  const streamScores={};Object.entries(streamRaw).sort((a,b)=>b[1]-a[1]).forEach(([s,v])=>{streamScores[s]=Math.round((v/streamTotal)*100);});
  const pctSum=Object.values(streamScores).reduce((a,b)=>a+b,0);if(pctSum!==100){const top=Object.keys(streamScores)[0];streamScores[top]+=(100-pctSum);}
  const topStream=Object.entries(streamScores).sort((a,b)=>b[1]-a[1])[0][0];
  const typeScores={};Object.keys(SF_PERSONALITY_TYPES).forEach(t=>{typeScores[t]=0;});
  Object.entries(dims).forEach(([dim,val])=>{const t=SF_DIM_TO_TYPE[dim];if(t&&typeScores[t]!==undefined)typeScores[t]+=val;});
  const sortedTypes=Object.entries(typeScores).sort((a,b)=>b[1]-a[1]);const topType=sortedTypes[0][0];
  const typeTotalScore=sortedTypes.reduce((s,t)=>s+t[1],0)||1;
  const typePercentages={};sortedTypes.forEach(([type,score])=>{typePercentages[type]=Math.round((score/typeTotalScore)*100);});
  const tpSum=Object.values(typePercentages).reduce((a,b)=>a+b,0);if(tpSum!==100)typePercentages[sortedTypes[0][0]]+=(100-tpSum);
  const miDims=['Logical-Mathematical','Linguistic','Spatial','Musical','Kinesthetic','Interpersonal','Intrapersonal','Naturalistic'];
  const miScores={};miDims.forEach(d=>{miScores[d]=dims[d]||0;});
  miScores['Logical-Mathematical']=(dims['Logical-Mathematical']||0)+(dims['Logical']||0);
  const sortedMI=Object.entries(miScores).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>0).slice(0,3);
  const typeData=SF_PERSONALITY_TYPES[topType];
  return {personality:topType,personalityData:typeData,typePercentages,streamScores,topStream,miProfile:sortedMI,dims,dimToType:SF_DIM_TO_TYPE,testType:'stream'};
}

  {id:5,sec:'A',q:'Which of these industries feels most exciting to you?',opts:[{l:'A',t:'Technology — AI, blockchain, space tech, cybersecurity',s:{Investigative:2,Tech:2},ind:'Technology'},{l:'B',t:'Healthcare — hospitals, pharma, biotech, mental health',s:{Social:1,Science:2},ind:'Healthcare'},{l:'C',t:'Finance — investment banking, VC, fintech, insurance',s:{Enterprising:2,Commerce:2},ind:'Finance'},{l:'D',t:'Creative — advertising, film, fashion, gaming, media',s:{Artistic:2,Creative:2},ind:'Creative/Media'}]},
  {id:6,sec:'A',q:'And your second choice of industry?',opts:[{l:'A',t:'Education — edtech, coaching, universities, skill development',s:{Social:1,Teaching:1},ind:'Education'},{l:'B',t:'Government — civil services, policy, defence, public administration',s:{Conventional:1,Social:1},ind:'Government'},{l:'C',t:'Legal — corporate law, litigation, IP rights, compliance',s:{Investigative:1,Enterprising:1},ind:'Legal'},{l:'D',t:'Entrepreneurship — starting a company, consulting, freelancing',s:{Enterprising:2},ind:'Entrepreneurship'}]},
  {id:7,sec:'A',q:"When working on something, you get frustrated when...",opts:[{l:'A',t:"People don't use logic or data to make decisions",s:{Investigative:2},ind:'Analytical'},{l:'B',t:"There's no room for creativity — everything is by the book",s:{Artistic:2,Openness:1},ind:'Creative'},{l:'C',t:'Nobody is taking charge and things are disorganised',s:{Enterprising:2,Leader:1},ind:'Leadership'},{l:'D',t:"People don't consider how decisions affect others",s:{Social:2,Agreeableness:1},ind:'People-oriented'}]},
  {id:8,sec:'A',q:'Your ideal college experience involves...',opts:[{l:'A',t:'Labs, hackathons, research projects, and internships at tech companies',s:{Investigative:1,Realistic:1},ind:'IIT/NIT/IISC'},{l:'B',t:'Clubs, fests, NGO work, diverse friendships, and real-world exposure',s:{Social:2},ind:'Liberal arts/DU'},{l:'C',t:'Case studies, simulations, competitions, and corporate connections',s:{Enterprising:2,Conventional:1},ind:'IIM/SRCC/Symbiosis'},{l:'D',t:'Studios, portfolios, exhibitions, performances, and creative residencies',s:{Artistic:2},ind:'NID/FTII/Srishti'}]},
  {id:9,sec:'A',q:'Which of these tasks would you be most comfortable doing for 8 hours straight?',opts:[{l:'A',t:'Coding, solving complex problems, or analysing data',s:{Investigative:2,Realistic:1},ind:'Tech/Engineering'},{l:'B',t:'Writing, designing, editing videos, or creating content',s:{Artistic:2},ind:'Creative/Media'},{l:'C',t:'Talking to people — selling, managing, consulting, or teaching',s:{Enterprising:1,Social:1},ind:'Business/Education'},{l:'D',t:'Caring for patients, counselling, or working on social projects',s:{Social:2},ind:'Healthcare/Social'}]},
  {id:10,sec:'A',q:'What type of problems do you ENJOY solving?',opts:[{l:'A',t:'Technical — bugs, equations, systems, optimisation',s:{Investigative:2,Logical:1},ind:'Engineering/Data'},{l:'B',t:'People — conflicts, team dynamics, motivation, health',s:{Social:2},ind:'HR/Medicine/Teaching'},{l:'C',t:'Creative — design challenges, storytelling, branding',s:{Artistic:2},ind:'Design/Advertising'},{l:'D',t:'Strategic — business problems, market positioning, growth',s:{Enterprising:2},ind:'Consulting/Finance'}]},
  {id:11,sec:'A',q:'If you started a YouTube channel today, it would be about...',opts:[{l:'A',t:'Tech reviews, coding tutorials, or science explained',s:{Investigative:1,Realistic:1},ind:'Tech/Science'},{l:'B',t:'Personal finance, business tips, or career advice',s:{Enterprising:2},ind:'Finance/Business'},{l:'C',t:'Art, photography, travel, fashion, or music',s:{Artistic:2},ind:'Creative/Lifestyle'},{l:'D',t:'Health, fitness, mental wellness, or life coaching',s:{Social:1,Interpersonal:1},ind:'Health/Wellness'}]},
  {id:12,sec:'A',q:'Which of these role models do you relate to most?',opts:[{l:'A',t:'Sundar Pichai / Elon Musk — building technology that changes the world',s:{Investigative:1,Enterprising:1,Tech:1},ind:'Tech+Leadership'},{l:'B',t:'Dr. Devi Shetty / Sudha Murty — serving people, creating social impact',s:{Social:2,Purpose:1},ind:'Healthcare/Social'},{l:'C',t:'AR Rahman / Zaha Hadid — creating art and beauty that inspires millions',s:{Artistic:2},ind:'Creative'},{l:'D',t:'Ratan Tata / Indra Nooyi — leading massive organisations with vision',s:{Enterprising:2,Leader:1},ind:'Business/Corporate'}]},
  {id:13,sec:'B',q:'How much do you enjoy trying completely new things — new food, new places, new subjects?',opts:[{l:'A',t:'Love it — novelty energises me',s:{Openness:3},ind:''},{l:'B',t:'I like some variety but also need my comfort zone',s:{Openness:1},ind:''},{l:'C',t:"I'm cautious — I research before trying new things",s:{Openness:1,Conscientious:1},ind:''},{l:'D',t:'I prefer what I know — familiar is comfortable',s:{Conventional:2},ind:''}]},
  {id:14,sec:'B',q:'When a deadline is approaching, you typically...',opts:[{l:'A',t:'I finished days ago — I plan ahead and hate last-minute rush',s:{Conscientious:3},ind:''},{l:'B',t:"I'm on track — steady progress, will finish on time",s:{Conscientious:2},ind:''},{l:'C',t:'I work better under pressure — the urgency helps me focus',s:{Resilience:2},ind:''},{l:'D',t:'I struggle with deadlines — I wish I could manage time better',s:{LowC:1},ind:''}]},
  {id:15,sec:'B',q:'At a party or social gathering, you...',opts:[{l:'A',t:"Talk to everyone — I'm energised by meeting people",s:{Extraversion:3},ind:''},{l:'B',t:'Have a few meaningful conversations with close friends',s:{Ambiversion:1},ind:''},{l:'C',t:'Stay near people I know but enjoy observing',s:{Introversion:1},ind:''},{l:'D',t:'Prefer smaller, quieter settings — large groups drain me',s:{Introversion:2},ind:''}]},
  {id:16,sec:'B',q:'When someone criticises your work, your first reaction is...',opts:[{l:'A',t:'I listen, consider it, and improve — feedback is useful',s:{Agreeableness:2,Stability:1},ind:''},{l:'B',t:'I defend my work but stay calm — I believe in what I did',s:{Assertiveness:2},ind:''},{l:'C',t:"I feel hurt but try not to show it",s:{Agreeableness:1,Sensitivity:1},ind:''},{l:'D',t:"I get annoyed — I put a lot of effort into my work",s:{LowAgreeableness:1},ind:''}]},
  {id:17,sec:'B',q:'How often do you feel stressed or anxious about school, exams, or the future?',opts:[{l:'A',t:'Rarely — I stay calm even when things are tough',s:{Stability:3},ind:''},{l:'B',t:'Sometimes — but I manage it and move on',s:{Stability:2},ind:''},{l:'C',t:'Often — I overthink and worry a lot about outcomes',s:{Neuroticism:2},ind:''},{l:'D',t:'A lot — I feel pressure from expectations constantly',s:{Neuroticism:3},ind:''}]},
  {id:18,sec:'B',q:'How important is it to you to be THE BEST in your field?',opts:[{l:'A',t:"Extremely — I'm very competitive and driven to be #1",s:{Achievement:3,Competitive:2},ind:''},{l:'B',t:"Important — I want to be among the top, but not obsessed",s:{Achievement:2},ind:''},{l:'C',t:'Moderately — I want to be good, but work-life balance matters more',s:{Balance:2},ind:''},{l:'D',t:"Not much — I'd rather be happy and fulfilled than ranked",s:{Wellbeing:2},ind:''}]},
  {id:19,sec:'B',q:'When you have a decision to make, you usually...',opts:[{l:'A',t:'Research thoroughly — pros/cons list, data, opinions, then decide',s:{Analytical:2,Conscientious:1},ind:''},{l:'B',t:'Trust my gut — I have good instincts and decide quickly',s:{Enterprising:1,Openness:1},ind:''},{l:'C',t:'Ask people I trust — their perspective helps me see clearly',s:{Social:1,Agreeableness:1},ind:''},{l:'D',t:"Take my time — I don't like being rushed into decisions",s:{Careful:1,Intrapersonal:1},ind:''}]},
  {id:20,sec:'B',q:'Which of these describes your relationship with rules and authority?',opts:[{l:'A',t:'I follow rules — they exist for a reason and I respect structure',s:{Conventional:2,Conscientious:1},ind:''},{l:'B',t:"I follow rules but question ones that don't make sense",s:{Balanced:1,Critical:1},ind:''},{l:'C',t:'I prefer guidelines over strict rules — I need some flexibility',s:{Openness:1},ind:''},{l:'D',t:'I dislike rigid rules — I work best when I can do things my way',s:{Openness:2,Autonomy:1},ind:''}]},
  {id:21,sec:'B',q:'How do you recharge after a long, tiring week?',opts:[{l:'A',t:'Alone time — books, music, walks, or just quiet',s:{Introversion:2},ind:''},{l:'B',t:'Social time — friends, outings, parties, or conversations',s:{Extraversion:2},ind:''},{l:'C',t:'Creative time — making something, writing, drawing, or playing music',s:{Artistic:1,Openness:1},ind:''},{l:'D',t:'Physical activity — sports, gym, hiking, or yoga',s:{Realistic:1,Kinesthetic:1},ind:''}]},
  {id:22,sec:'B',q:'In a team, you prefer to be the person who...',opts:[{l:'A',t:'Sets the vision and strategy — the leader',s:{Enterprising:2,Leader:1},ind:'CEO/Director'},{l:'B',t:'Does the deep work — the expert on the topic',s:{Investigative:2,Specialist:1},ind:'Researcher/Analyst'},{l:'C',t:'Keeps the team together — the communicator and mediator',s:{Social:2,Interpersonal:1},ind:'HR/Counsellor'},{l:'D',t:'Gets things done — executes tasks reliably and on time',s:{Conscientious:2,Practical:1},ind:'Engineer/Accountant'}]},
  {id:23,sec:'C',q:'Which of these problems would you find EASIEST to solve?',opts:[{l:'A',t:'A maths puzzle involving patterns and logic',s:{Logical:2},ind:'Engineering/Data Science'},{l:'B',t:'Summarising a complex article into 3 key points',s:{Verbal:2},ind:'Law/Journalism/MBA'},{l:'C',t:'Estimating the budget for a school event from scratch',s:{Numerical:2},ind:'CA/Finance/Economics'},{l:'D',t:'Arranging furniture in a room for the best layout and look',s:{Spatial:2},ind:'Architecture/Design'}]},
  {id:24,sec:'C',q:'When explaining something complicated to a friend, you usually...',opts:[{l:'A',t:"Use analogies and simple comparisons — 'think of it like...'",s:{Verbal:2},ind:'Teaching/Consulting'},{l:'B',t:"Draw a diagram or show a visual — 'look at this picture'",s:{Spatial:2},ind:'Design/Architecture'},{l:'C',t:'Walk them through it step by step logically',s:{Logical:2},ind:'Research/Engineering'},{l:'D',t:"Give them a real-world example — 'imagine you're at a shop...'",s:{Practical:2},ind:'Applied careers'}]},
  {id:25,sec:'C',q:'Which of these academic tasks would you be most comfortable being tested on?',opts:[{l:'A',t:'Solving 10 integration or differentiation problems under time pressure',s:{Mathematical:2},ind:'IIT/Engineering'},{l:'B',t:'Writing a 1000-word opinion piece on a current issue in 45 minutes',s:{Verbal:2,Expression:1},ind:'Law/CUET/Journalism'},{l:'C',t:"Analysing a company's financial statement and presenting findings",s:{Analytical:1,Business:1},ind:'CA/CFA/MBA'},{l:'D',t:'Creating a poster or 3D model for a science project',s:{Spatial:2,Creative:1},ind:'NID/Architecture'}]},
  {id:26,sec:'C',q:'How comfortable are you with numbers and calculations?',opts:[{l:'A',t:'Very comfortable — I enjoy numerical work and it comes naturally',s:{Numerical:3},ind:'CA/Engineering/Data'},{l:'B',t:"Somewhat — I can do it if needed but don't love it",s:{Numerical:1},ind:''},{l:'C',t:'Not very — I prefer words and ideas over numbers',s:{Verbal:1},ind:'Law/Media/Design'},{l:'D',t:'I actively avoid heavy maths whenever possible',s:{AntiNumerical:1},ind:'Arts/Creative'}]},
  {id:27,sec:'C',q:'When reading a news article, you notice...',opts:[{l:'A',t:'The data and statistics — I want evidence, not opinions',s:{Analytical:2,Investigative:1},ind:'Data/Research'},{l:'B',t:'The writing quality and how arguments are structured',s:{Verbal:2,Artistic:1},ind:'Journalism/Law'},{l:'C',t:"The human impact — who's affected and how",s:{Social:2,Empathy:1},ind:'Healthcare/Social'},{l:'D',t:"The business angle — who's winning, losing, or investing",s:{Enterprising:2,Business:1},ind:'Business/Finance'}]},
  {id:28,sec:'C',q:'How quickly do you pick up new technology or apps?',opts:[{l:'A',t:"Very fast — I'm the one who teaches others how to use new tech",s:{Tech:3,Digital:2},ind:'CS/AI/Data'},{l:'B',t:'Fairly fast — I figure things out after some exploration',s:{Tech:2},ind:''},{l:'C',t:"Average — I can use tech but don't geek out about it",s:{Tech:1},ind:''},{l:'D',t:'Slow — I prefer traditional methods and tools',s:{LowTech:1},ind:'Traditional'}]},
  {id:29,sec:'C',q:"How good are you at understanding other people's emotions?",opts:[{l:'A',t:"Very — I often know how someone's feeling before they say it",s:{EQ:3,Social:1},ind:'Medicine/HR/Counselling'},{l:'B',t:"Good — I'm attentive but not always right",s:{EQ:2},ind:''},{l:'C',t:"Average — I understand if they tell me, but I don't always catch subtle cues",s:{EQ:1},ind:''},{l:'D',t:'I struggle with this — I focus more on facts than feelings',s:{Logical:1,LowEQ:1},ind:'Engineering/Research'}]},
  {id:30,sec:'C',q:'When you look at a building, product, or advertisement, you notice...',opts:[{l:'A',t:'The design, aesthetics, and visual appeal first',s:{Spatial:2,Artistic:1},ind:'Design/Architecture'},{l:'B',t:'The engineering — how it works, the mechanics behind it',s:{Logical:2,Realistic:1},ind:'Engineering'},{l:'C',t:"The message — what it's trying to communicate",s:{Verbal:1,Social:1},ind:'Marketing/Communication'},{l:'D',t:'The price or business model — is it a good deal?',s:{Business:2,Enterprising:1},ind:'Finance/Business'}]},
  {id:31,sec:'D',q:'Rank what matters MOST in your ideal career (pick ONE):',opts:[{l:'A',t:'High income — I want to be financially very comfortable',s:{Wealth:3},ind:'Finance/Medicine/Tech'},{l:'B',t:'Job security — I want a guaranteed, stable career',s:{Security:3},ind:'Government/Banking'},{l:'C',t:'Passion alignment — I want to love what I do every day',s:{Passion:3},ind:'Creative/Research'},{l:'D',t:'Social impact — I want my work to help people or change things',s:{Impact:3},ind:'Healthcare/NGO'}]},
  {id:32,sec:'D',q:'How much risk are you willing to take in your career?',opts:[{l:'A',t:"High risk — startup, freelance, unconventional path — I'll figure it out",s:{Entrepreneur:3,Risk:3},ind:'Startup/Freelance'},{l:'B',t:'Moderate risk — try something interesting but keep a safety net',s:{Moderate:2},ind:'Corporate/Tech'},{l:'C',t:'Low risk — I want a clear, proven path with predictable growth',s:{LowRisk:2,Conventional:1},ind:'Medicine/CA'},{l:'D',t:'Zero risk — I want a government job or family business — guaranteed stability',s:{ZeroRisk:2,Security:1},ind:'Government'}]},
  {id:33,sec:'D',q:'Where do you see yourself at age 30?',opts:[{l:'A',t:'Leading a team at a top company or my own startup',s:{Leadership:2,Enterprising:1},ind:'MBA/IAS/Entrepreneur'},{l:'B',t:'A highly specialised expert — the go-to person in my field',s:{Specialist:2,Mastery:1},ind:'MD/PhD/IITian'},{l:'C',t:'Comfortably settled — good income, family, work-life balance',s:{Security:2,Balance:1},ind:'Corporate/Government'},{l:'D',t:'Doing meaningful work — healthcare, education, or social impact',s:{Purpose:2,Social:1},ind:'Doctor/Teacher/NGO'}]},
  {id:34,sec:'D',q:'How do you feel about working long hours (60-80 hrs/week) in your 20s?',opts:[{l:'A',t:"Totally fine — I'll grind now to succeed later",s:{HighIntensity:3},ind:'IB/Surgery/Big Law'},{l:'B',t:'Acceptable for 2-3 years — then I need balance',s:{MedIntensity:2},ind:'Consulting/Corporate'},{l:'C',t:"I'd prefer a 40-50 hour week from the start",s:{Balanced:2},ind:'Government/Teaching'},{l:'D',t:'Absolutely not — my mental health and personal life come first',s:{Wellbeing:3},ind:'Freelance/Creative'}]},
  {id:35,sec:'D',q:'What would make you QUIT a well-paying job?',opts:[{l:'A',t:"If I wasn't learning or growing anymore",s:{Growth:2,Openness:1},ind:''},{l:'B',t:'If it was hurting my health or relationships',s:{Wellbeing:2,Balance:1},ind:''},{l:'C',t:'If the work was unethical or harming people',s:{Ethics:2,Purpose:1},ind:''},{l:'D',t:"I wouldn't quit a well-paying job — stability matters most",s:{Security:2},ind:''}]},
  {id:36,sec:'D',q:"Which of these 'perks' matters most to you in a job?",opts:[{l:'A',t:'Big bonuses and fast promotions',s:{Achievement:2,Money:1},ind:'Finance/Consulting'},{l:'B',t:'Flexibility — work from home, choose your hours',s:{Autonomy:2},ind:'Tech/Freelance'},{l:'C',t:'A great team and mentors who help you grow',s:{Relatedness:2},ind:'Corporate/Education'},{l:'D',t:'Making a visible difference — seeing the impact of your work',s:{Purpose:2},ind:'Healthcare/NGO'}]},
  {id:37,sec:'E',q:'How many years of intense studying AFTER 12th are you prepared for?',opts:[{l:'A',t:'3 years — I want a quick degree and to start working',s:{LowEffort:3},ind:'BCA/B.Com/BBA'},{l:'B',t:"4-5 years — a bachelor's degree is fine",s:{MedEffort:3},ind:'B.Tech/B.Sc/BA'},{l:'C',t:"5-7 years — I'm ready for professional courses (CA, Law, PG)",s:{HighEffort:3},ind:'CA/LLB/M.Tech/MBA'},{l:'D',t:'7+ years — MBBS + MD, PhD, IAS prep — whatever it takes',s:{VeryHighEffort:3},ind:'MBBS+PG/PhD/IAS'}]},
  {id:38,sec:'E',q:'How do you feel about competitive entrance exams?',opts:[{l:'A',t:'Bring it on — I thrive under competitive pressure',s:{Competitive:3},ind:'JEE/NEET/CLAT'},{l:'B',t:"I'll prepare seriously, but I want backup options too",s:{Balanced:2},ind:'JEE+State CET'},{l:'C',t:"I'd prefer university/board percentage-based admissions",s:{Merit:2},ind:'CUET/University'},{l:'D',t:'I want skill-based or portfolio-based entry — no exam stress',s:{Alternative:2},ind:'NID/NIFT/Portfolio'}]},
  {id:39,sec:'E',q:"If one career had a 90% chance of a ₹8 LPA job, and another had a 30% chance of a ₹30 LPA job, you'd choose...",opts:[{l:'A',t:'The ₹30 LPA gamble — high risk, high reward is my style',s:{HighRisk:2,Ambitious:1},ind:'Startup/IB/Surgery'},{l:'B',t:'The ₹8 LPA certainty — I want stability, not risk',s:{Security:2,Conventional:1},ind:'Government/CA'},{l:'C',t:"I'd find a career that has maybe 60% chance of ₹15 LPA — balanced",s:{Balanced:2},ind:'Consulting/IT'},{l:'D',t:"Neither — salary isn't my primary decision factor",s:{ValuesDriven:2},ind:'Creative/Social'}]},
  {id:40,sec:'E',q:"Final question — complete this sentence: 'After 12th, the most important thing for me is...'",opts:[{l:'A',t:'Getting into the BEST college — ranking and brand matter',s:{Brand:2,Achievement:1},ind:'IIT/AIIMS/NLU/IIM'},{l:'B',t:'Choosing the RIGHT course — it should match who I am',s:{Fit:2,SelfAwareness:1},ind:'Course-fit-driven'},{l:'C',t:"Keeping my options open — I don't want to be locked in",s:{Flexibility:2,Openness:1},ind:'Liberal arts/Broad'},{l:'D',t:'Starting to build — skills, portfolio, network, or business',s:{Execution:2,Entrepreneur:1},ind:'Skill-based/Startup'}]},
];

function computeCareerCompassResults(answers) {
  const dims={};const effortScores={LowEffort:0,MedEffort:0,HighEffort:0,VeryHighEffort:0};const industryHits={};
  answers.forEach((optIdx,qIdx)=>{
    const opt=CC_QUESTIONS[qIdx].opts[optIdx];
    Object.entries(opt.s).forEach(([dim,val])=>{
      if(effortScores.hasOwnProperty(dim))effortScores[dim]+=val;
      else dims[dim]=(dims[dim]||0)+val;
    });
    if(opt.ind&&opt.ind!==''){opt.ind.split('/').forEach(ind=>{const trimmed=ind.trim();if(trimmed)industryHits[trimmed]=(industryHits[trimmed]||0)+1;});}
  });
  const typeScores={};Object.keys(CC_PERSONALITY_TYPES).forEach(t=>{typeScores[t]=0;});
  Object.entries(dims).forEach(([dim,val])=>{const t=CC_DIM_TO_TYPE[dim];if(t&&typeScores[t]!==undefined)typeScores[t]+=val;});
  const sortedTypes=Object.entries(typeScores).sort((a,b)=>b[1]-a[1]);const topType=sortedTypes[0][0];
  const typeTotalScore=sortedTypes.reduce((s,t)=>s+t[1],0)||1;
  const typePercentages={};sortedTypes.forEach(([type,score])=>{typePercentages[type]=Math.round((score/typeTotalScore)*100);});
  const typePctSum=Object.values(typePercentages).reduce((a,b)=>a+b,0);if(typePctSum!==100&&sortedTypes.length>0)typePercentages[sortedTypes[0][0]]+=(100-typePctSum);
  const riasecDims=['Realistic','Investigative','Artistic','Social','Enterprising','Conventional'];
  const riasecScores={};riasecDims.forEach(d=>{riasecScores[d]=dims[d]||0;});
  const riasecTotal=Object.values(riasecScores).reduce((a,b)=>a+b,0)||1;
  const riasecPcts={};Object.entries(riasecScores).sort((a,b)=>b[1]-a[1]).forEach(([d,v])=>{riasecPcts[d]=Math.round((v/riasecTotal)*100);});
  const riasecPctSum=Object.values(riasecPcts).reduce((a,b)=>a+b,0);
  if(riasecPctSum!==100){const topR=Object.entries(riasecPcts).sort((a,b)=>b[1]-a[1])[0];if(topR)riasecPcts[topR[0]]+=(100-riasecPctSum);}
  const topRIASEC=Object.entries(riasecScores).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
  const effortEntries=Object.entries(effortScores).sort((a,b)=>b[1]-a[1]);
  let effortTier='Medium (4-5 years)';
  if(effortEntries[0][1]>0){const map={LowEffort:'Low (3 years)',MedEffort:'Medium (4-5 years)',HighEffort:'High (5-7 years)',VeryHighEffort:'Very High (7-10+ years)'};effortTier=map[effortEntries[0][0]];}
  const topIndustries=Object.entries(industryHits).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
  const typeData=CC_PERSONALITY_TYPES[topType];
  return {personality:topType,personalityData:typeData,typePercentages,riasecPcts,topRIASEC,effortTier,topIndustries:topIndustries.length>=2?topIndustries:typeData.industries.slice(0,3),dims,dimToType:CC_DIM_TO_TYPE,testType:'compass'};
}

function QuizScreen({questions,sections,onComplete,onBack}){
  const [current,setCurrent]=useState(0);
  const [answers,setAnswers]=useState([]);
  const [selected,setSelected]=useState(null);
  const [animKey,setAnimKey]=useState(0);

  const q=questions[current];
  const progress=(current/questions.length)*100;
  const secInfo=sections?sections.find(s=>s.key===q.sec):null;
  const optColors=['#2563eb','#7c3aed','#059669','#d97706'];

  function selectOption(idx){
    setSelected(idx);
    setTimeout(()=>{
      const newAnswers=[...answers,idx];
      if(current<questions.length-1){setAnswers(newAnswers);setCurrent(current+1);setSelected(null);setAnimKey(k=>k+1);}
      else{onComplete(newAnswers);}
    },400);
  }

  function goBack(){
    if(current>0){setAnswers(answers.slice(0,-1));setCurrent(current-1);setSelected(null);setAnimKey(k=>k+1);}
    else{onBack();}
  }

  return(
    <div style={{height:'100%',display:'flex',flexDirection:'column'}}>
      {/* Progress */}
      <div style={{background:B.white,padding:'16px 24px 12px',borderBottom:`1px solid ${B.border}`}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
          <button onClick={goBack} style={{background:'none',border:'none',color:B.teal,cursor:'pointer',fontSize:14,fontWeight:600,fontFamily:'Poppins',padding:0}}>&#x2190; Back</button>
          <span style={{fontSize:13,fontWeight:600,color:B.muted}}>{current+1} of {questions.length}</span>
        </div>
        <div style={{height:6,background:B.border,borderRadius:3,overflow:'hidden'}}>
          <div style={{height:'100%',borderRadius:3,background:B.grad,width:`${progress}%`,transition:'width .4s cubic-bezier(.22,1,.36,1)'}}/>
        </div>
        {secInfo&&(
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:8}}>
            <span style={{fontSize:11,color:B.teal,fontWeight:600,textTransform:'uppercase',letterSpacing:1.2}}>Section {q.sec}: {secInfo.name}</span>
            <span style={{fontSize:10,color:B.slate}}>{secInfo.framework}</span>
          </div>
        )}
        {!secInfo&&q.section&&(
          <div style={{fontSize:11,color:B.teal,fontWeight:600,textTransform:'uppercase',letterSpacing:1.2,marginTop:8,textAlign:'center'}}>{q.section}</div>
        )}
      </div>

      {/* Question + Options */}
      <div key={animKey} className="slide-up" style={{flex:1,overflow:'auto',padding:'24px'}}>
        <h2 style={{fontSize:'clamp(16px,3vw,20px)',fontWeight:700,color:B.navy,lineHeight:1.5,marginBottom:24,textAlign:'center'}}>{q.q}</h2>
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          {q.opts.map((opt,idx)=>{
            const isSelected=selected===idx;
            return(
              <button key={idx} onClick={()=>selected===null&&selectOption(idx)}
                style={{display:'flex',alignItems:'flex-start',gap:12,background:isSelected?B.navy:B.white,border:`2px solid ${isSelected?B.navy:B.border}`,borderRadius:14,padding:'16px 18px',cursor:'pointer',textAlign:'left',fontFamily:'Poppins',transition:'all .3s ease',transform:isSelected?'scale(0.98)':'scale(1)',boxShadow:isSelected?'0 4px 16px rgba(31,54,98,.2)':'0 2px 8px rgba(0,0,0,.04)'}}
                onMouseOver={e=>{if(selected===null){e.currentTarget.style.borderColor=optColors[idx];e.currentTarget.style.boxShadow='0 4px 16px rgba(0,0,0,.08)';}}}
                onMouseOut={e=>{if(!isSelected){e.currentTarget.style.borderColor=B.border;e.currentTarget.style.boxShadow='0 2px 8px rgba(0,0,0,.04)';}}}
              >
                <div style={{width:32,height:32,borderRadius:8,flexShrink:0,background:isSelected?B.teal:optColors[idx]+'18',color:isSelected?B.white:optColors[idx],display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:14,transition:'all .3s'}}>
                  {isSelected?'✓':opt.l}
                </div>
                <span style={{fontSize:14,lineHeight:1.5,fontWeight:500,color:isSelected?B.white:B.text,transition:'color .3s',paddingTop:4}}>{opt.t}</span>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

      {/* Industry Fit */}
      {results.topIndustries&&(
        <div className="slide-up" style={{background:B.white,borderRadius:16,padding:'24px',border:`1px solid ${B.border}`,marginBottom:16}}>
          <div style={{fontSize:11,fontWeight:600,color:B.teal,textTransform:'uppercase',letterSpacing:1.5,marginBottom:12}}>TOP INDUSTRIES</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
            {results.topIndustries.map((ind,i)=>(
              <div key={i} style={{background:i===0?B.navy:B.tealLight,color:i===0?B.white:B.navy,borderRadius:16,padding:'8px 16px',fontSize:12,fontWeight:600}}>{ind}</div>
            ))}
          </div>
        </div>
      )}

      {/* HOW YOUR SCORE WAS CALCULATED */}
      <div className="slide-up" style={{background:B.white,borderRadius:16,padding:'24px',border:`1px solid ${B.border}`,marginBottom:16}}>
        <div style={{fontSize:11,fontWeight:600,color:B.teal,textTransform:'uppercase',letterSpacing:1.5,marginBottom:12}}>HOW YOUR SCORE WAS CALCULATED</div>

        {/* Formula */}
        <div style={{background:B.tealLight,borderRadius:12,padding:'16px',marginBottom:16}}>
          <div style={{fontSize:12,fontWeight:600,color:B.navy,marginBottom:8}}>The Formula</div>
          <ol style={{fontSize:12,color:B.muted,lineHeight:1.8,paddingLeft:18}}>
            <li>Each answer adds points to psychological <strong>dimensions</strong> (e.g. Investigative +2, Social +1).</li>
            <li>Dimensions are mapped to <strong>personality types</strong> using established psychology frameworks.</li>
            <li>The type with the <strong>highest total score</strong> becomes your primary type.</li>
            {testType==='stream'&&<li>Stream scores use <strong>dual scoring</strong>: 40% direct stream mapping from each answer + 60% dimension-weighted calculation via stream weight matrix.</li>}
          </ol>
        </div>

        {/* Raw Dimensions */}
        <div style={{fontSize:12,fontWeight:600,color:B.navy,marginBottom:8}}>Raw Dimension Scores</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:16}}>
          {rawDims.slice(0,20).map(([dim,val],i)=>(
            <div key={dim} style={{background:i<5?B.navy+'0D':B.bg,borderRadius:8,padding:'6px 10px',fontSize:11,border:`1px solid ${i<5?B.navy+'30':B.border}`}}>
              <span style={{fontWeight:600,color:B.navy}}>{dim}</span>
              <span style={{color:B.teal,fontWeight:700,marginLeft:6}}>{val}</span>
            </div>
          ))}
        </div>

        {/* Dimension to Type mapping */}
        <div style={{fontSize:12,fontWeight:600,color:B.navy,marginBottom:8}}>Dimension-to-Type Mapping (Your top scores)</div>
        <div style={{fontSize:11,color:B.muted,lineHeight:1.8}}>
          {rawDims.slice(0,8).map(([dim])=>{
            const mapped=dimToType[dim];
            return mapped?<div key={dim}><span style={{fontWeight:600}}>{dim}</span> &#x2192; {mapped}</div>:null;
          })}
        </div>
      </div>

      {/* Disclaimer */}
      <div style={{background:'#fef3c7',borderRadius:14,padding:'18px 20px',border:'1px solid #fbbf24',marginBottom:16}}>
        <p style={{fontSize:12,fontWeight:600,color:'#92400e',marginBottom:4}}>Important Note</p>
        <p style={{fontSize:11,color:'#92400e',lineHeight:1.7}}>
          This assessment is a scientifically-informed starting point for career exploration, not a final verdict. Your results reflect patterns in your responses today — interests and priorities evolve. We recommend discussing your results with a career counsellor. The 12thPlus team is here to help — call us at <strong>6363613135</strong>.
        </p>
      </div>

      {/* Take Another Test */}
      <button onClick={onReset} style={{
        width:'100%',background:B.grad,color:B.white,border:'none',borderRadius:20,padding:'16px',
        fontSize:15,fontWeight:700,cursor:'pointer',fontFamily:'Poppins',boxShadow:'0 4px 16px rgba(22,174,200,.3)',marginBottom:24,
      }}>
        &#x2190; Back to Dashboard
      </button>
    </div>
  );
}

// ============================================================
// MAIN APP
// ============================================================
function App(){
  const [screen,setScreen]=useState('dashboard');
  const [classLevel,setClassLevel]=useState(null);
  const [testType,setTestType]=useState(null);
  const [results,setResults]=useState(null);
  const [resetTimer,setResetTimer]=useState(90);
  const timerRef=useRef(null);
  const lastActivity=useRef(Date.now());

  // Reset timer logic
  const resetToHome=useCallback(()=>{
    setScreen('dashboard');setClassLevel(null);setTestType(null);setResults(null);setResetTimer(90);
  },[]);

  useEffect(()=>{
    function handleActivity(){lastActivity.current=Date.now();setResetTimer(90);}
    window.addEventListener('click',handleActivity);
    window.addEventListener('keydown',handleActivity);
    window.addEventListener('touchstart',handleActivity);
    timerRef.current=setInterval(()=>{
      const elapsed=Math.floor((Date.now()-lastActivity.current)/1000);
      const remaining=Math.max(0,90-elapsed);
      setResetTimer(remaining);
      if(remaining===0)resetToHome();
    },1000);
    return()=>{clearInterval(timerRef.current);window.removeEventListener('click',handleActivity);window.removeEventListener('keydown',handleActivity);window.removeEventListener('touchstart',handleActivity);};
  },[resetToHome]);

  function handleSelectClass(level){
    setClassLevel(level);
    if(level==='11-12'){setTestType('compass');setScreen('methodology');}
    else{setScreen('picker');}
  }

  function handleSelectQuiz(type){setTestType(type);setScreen('methodology');}

  function handleStartTest(){setScreen('quiz');}

  function handleQuizComplete(answers){
    let r;
    if(testType==='quick')r=computeQuickResults(answers);
    else if(testType==='stream')r=computeStreamFinderResults(answers);
    else r=computeCareerCompassResults(answers);
    setResults(r);setScreen('results');
  }

  function getQuestions(){
    if(testType==='quick')return QUICK_QUESTIONS;
    if(testType==='stream')return SF_QUESTIONS;
    return CC_QUESTIONS;
  }

  function getSections(){
    if(testType==='quick')return null;
    if(testType==='stream')return SF_SECTIONS;
    return CC_SECTIONS;
  }


  return(
    <div style={{display:'flex',flexDirection:'column',height:'100vh',overflow:'hidden',background:B.bg}}>

      {/* Header */}
      <div style={{background:B.white,borderBottom:`1px solid ${B.border}`,padding:'12px 24px',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div style={{width:36,height:36,borderRadius:10,background:B.teal,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <span style={{fontSize:16,fontWeight:900,color:B.white}}>12</span>
          </div>
          <span style={{fontSize:16,fontWeight:800,color:B.navy}}>12thplus.com</span>
          <span style={{fontSize:13,color:B.muted}}>|</span>
          <span style={{fontSize:13,color:B.muted}}>Demo Public School &middot; Bengaluru</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          {screen!=='dashboard'&&(
            <button onClick={resetToHome} style={{background:B.navy,color:B.white,border:'none',borderRadius:14,padding:'6px 16px',fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'Poppins'}}>&#x1F3E0; Home</button>
          )}
          <div style={{display:'flex',alignItems:'center',gap:8,background:resetTimer<30?'#fef2f2':B.bg,borderRadius:20,padding:'6px 14px'}}>
            <div style={{width:8,height:8,borderRadius:4,background:resetTimer<30?B.red:B.green,animation:resetTimer<15?'blink 1s infinite':'none'}}/>
            <span style={{fontSize:12,fontWeight:600,color:resetTimer<30?B.red:B.muted}}>Resets in {resetTimer}s</span>
          </div>
        </div>
      </div>

      {/* Content Area */}
      <div style={{flex:1,overflow:'hidden'}}>
        {screen==='dashboard'&&<Dashboard onSelectClass={handleSelectClass}/>}
        {screen==='picker'&&<QuizPicker onSelect={handleSelectQuiz} onBack={resetToHome}/>}
        {screen==='methodology'&&<MethodologyScreen testType={testType} onStart={handleStartTest} onBack={()=>{if(classLevel==='5-10')setScreen('picker');else resetToHome();}}/>}
        {screen==='quiz'&&<QuizScreen questions={getQuestions()} sections={getSections()} onComplete={handleQuizComplete} onBack={()=>setScreen('methodology')}/>}
        {screen==='results'&&<ResultsScreen results={results} onReset={resetToHome}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
